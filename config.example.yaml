server:
  base_url: "https://www.cdnsha.org"
  timeout: 30  # 超时时间（秒）

accounts:
  - username: "your_username"
    password: "your_password"
    enabled: true  # 必须明确设置为 true 才会启用
  # 可以添加多个账号
  # - username: "another_user"
  #   password: "another_pass"
  #   enabled: true

scheduler:
  # cron 表达式：秒 分 时 日 月 周
  # 每天早上 9 点执行
  cron: "0 0 9 * * *"
  timezone: "Asia/Shanghai"
  # 随机延迟时间（分钟），在定时任务触发后随机延迟 0-N 分钟执行，模拟人工操作
  # 例如设置为 30，则会在 9:00-9:30 之间随机执行
  random_delay: 30

log:
  level: "info"  # debug, info, warn, error
  file: "logs/app.log"
  max_size: 100  # MB
  max_backups: 7

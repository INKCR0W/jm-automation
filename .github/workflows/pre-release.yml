name: Pre-release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out

  build-and-release:
    name: Build and Create Pre-release
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${LATEST_TAG}-dev-${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          
          # Linux AMD64
          mkdir -p dist/jm-automation-linux-amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-linux-amd64/jm-automation \
            cmd/jm-automation/main.go
          
          # Linux ARM64
          mkdir -p dist/jm-automation-linux-arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-linux-arm64/jm-automation \
            cmd/jm-automation/main.go
          
          # Windows AMD64
          mkdir -p dist/jm-automation-windows-amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-windows-amd64/jm-automation.exe \
            cmd/jm-automation/main.go
          
          # macOS AMD64
          mkdir -p dist/jm-automation-darwin-amd64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-darwin-amd64/jm-automation \
            cmd/jm-automation/main.go
          
          # macOS ARM64
          mkdir -p dist/jm-automation-darwin-arm64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-darwin-arm64/jm-automation \
            cmd/jm-automation/main.go

      - name: Create archives
        run: |
          cd dist
          
          # Linux AMD64
          tar czf jm-automation-linux-amd64.tar.gz -C jm-automation-linux-amd64 jm-automation
          
          # Linux ARM64
          tar czf jm-automation-linux-arm64.tar.gz -C jm-automation-linux-arm64 jm-automation
          
          # Windows AMD64
          (cd jm-automation-windows-amd64 && zip ../jm-automation-windows-amd64.zip jm-automation.exe)
          
          # macOS AMD64
          tar czf jm-automation-darwin-amd64.tar.gz -C jm-automation-darwin-amd64 jm-automation
          
          # macOS ARM64
          tar czf jm-automation-darwin-arm64.tar.gz -C jm-automation-darwin-arm64 jm-automation
          
          ls -lh

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log -10 --pretty=format:"- %s (%h)" --no-merges)
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Delete old pre-release
        run: |
          gh release delete pre-release --yes || true
          git push origin :refs/tags/pre-release || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          name: Pre-release (Development Build)
          tag_name: pre-release
          body: |
            ## ⚠️ 开发版本 (Pre-release)
            
            这是自动构建的开发版本，**不建议在生产环境使用**。
            
            **版本信息**：
            - 版本号：`${{ steps.version.outputs.VERSION }}`
            - Commit：`${{ steps.version.outputs.SHORT_SHA }}`
            - 构建时间：`${{ github.event.head_commit.timestamp }}`
            
            **最近更新**：
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            
            ## 下载说明
            
            请根据你的操作系统下载对应的文件：
            
            - **Linux (x64)**: `jm-automation-linux-amd64.tar.gz`
            - **Linux (ARM64)**: `jm-automation-linux-arm64.tar.gz`
            - **Windows (x64)**: `jm-automation-windows-amd64.zip`
            - **macOS (Intel)**: `jm-automation-darwin-amd64.tar.gz`
            - **macOS (Apple Silicon)**: `jm-automation-darwin-arm64.tar.gz`
            
            ## 使用方法
            
            1. 下载并解压对应平台的文件
            2. 参考 [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) 配置和使用
            
            ## 获取稳定版本
            
            如需稳定版本，请访问 [Releases](https://github.com/${{ github.repository }}/releases) 页面下载正式版本。
          files: |
            dist/*.tar.gz
            dist/*.zip
          draft: false
          prerelease: true

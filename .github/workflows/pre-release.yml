name: Pre-release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out

  build-and-release:
    name: Build and Create Pre-release
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
    concurrency:
      group: publish-pre-release
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo "v0.0.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${LATEST_TAG}-dev-${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          
          # Linux AMD64
          mkdir -p dist/jm-automation-linux-amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags timetzdata \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-linux-amd64/jm-automation \
            cmd/jm-automation/main.go
          
          # Linux ARM64
          mkdir -p dist/jm-automation-linux-arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags timetzdata \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-linux-arm64/jm-automation \
            cmd/jm-automation/main.go
          
          # Windows AMD64
          mkdir -p dist/jm-automation-windows-amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags timetzdata \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-windows-amd64/jm-automation.exe \
            cmd/jm-automation/main.go
          
          # macOS AMD64
          mkdir -p dist/jm-automation-darwin-amd64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -tags timetzdata \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-darwin-amd64/jm-automation \
            cmd/jm-automation/main.go
          
          # macOS ARM64
          mkdir -p dist/jm-automation-darwin-arm64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -tags timetzdata \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/jm-automation-darwin-arm64/jm-automation \
            cmd/jm-automation/main.go

      - name: Create archives
        run: |
          cd dist
          
          # Linux AMD64
          tar czf jm-automation-linux-amd64.tar.gz -C jm-automation-linux-amd64 jm-automation
          
          # Linux ARM64
          tar czf jm-automation-linux-arm64.tar.gz -C jm-automation-linux-arm64 jm-automation
          
          # Windows AMD64
          (cd jm-automation-windows-amd64 && zip ../jm-automation-windows-amd64.zip jm-automation.exe)
          
          # macOS AMD64
          tar czf jm-automation-darwin-amd64.tar.gz -C jm-automation-darwin-amd64 jm-automation
          
          # macOS ARM64
          tar czf jm-automation-darwin-arm64.tar.gz -C jm-automation-darwin-arm64 jm-automation
          
          ls -lh

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash .github/scripts/publish-pre-release.sh

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # 检查未处理的错误
    - govet         # 检查可疑的构造
    - ineffassign   # 检查无效的赋值
    - staticcheck   # 静态分析
    - unused        # 检查未使用的代码
    - misspell      # 检查拼写错误

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*go.uber.org/zap.Logger).Sync

    govet:
      enable:
        - shadow
      disable:
        - fieldalignment

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
